---
# Reuses the 1Password item "unifi-mcp" (local UniFi user, no SSO/MFA).
# Fields used: UNIFI_USERNAME, UNIFI_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unpoller-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UP_UNIFI_DEFAULT_USER: "{{ .UNIFI_USERNAME }}"
        UP_UNIFI_DEFAULT_PASS: "{{ .UNIFI_PASSWORD }}"
  dataFrom:
    - extract:
        key: unifi-mcp

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app librechat
  namespace: flux-system
spec:
  targetNamespace: services
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/services/librechat/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: onepassword-connect-clustersecretstore
      namespace: flux-system
    - name: unifi-dns
      namespace: network
    - name: redis-librechat
      namespace: flux-system
    - name: mongodb-librechat
      namespace: flux-system
    - name: meilisearch
      namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: librechat
      namespace: services
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: librechat-secret
      namespace: services
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret

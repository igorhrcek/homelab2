---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: invoiceninja
  namespace: services
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      invoiceninja:
        strategy: RollingUpdate

        annotations:
          secret.reloader.stakater.com/reload: "invoiceninja-secret"

        replicas: 1

        initContainers:
          init-storage:
            image:
              repository: busybox
              tag: latest
            command:
              - sh
              - -c
              - |
                mkdir -p /var/www/html/storage/app/public
                mkdir -p /var/www/html/storage/framework/{cache,sessions,views}
                mkdir -p /var/www/html/storage/logs
                chown -R 1500:1500 /var/www/html/storage

        containers:
          app:
            image:
              repository: invoiceninja/invoiceninja
              tag: 5.12
            envFrom:
              - secretRef:
                  name: invoiceninja-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true

    service:
      app:
        controller: &app invoiceninja
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: "10.40.0.15"
        ports:
          http:
            port: &port 80

    route:
      app:
        hostnames: ["invoices.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      storage:
        existingClaim: invoiceninja-storage
        advancedMounts:
          invoiceninja:
            init-storage:
              - path: /var/www/html/storage
            app:
              - path: /var/www/html/storage

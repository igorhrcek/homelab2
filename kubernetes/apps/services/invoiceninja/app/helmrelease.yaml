---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: invoiceninja
  namespace: services
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      invoiceninja:
        strategy: RollingUpdate

        annotations:
          secret.reloader.stakater.com/reload: "invoiceninja-secret"

        replicas: 1

        initContainers:
          init-storage:
            image:
              repository: busybox
              tag: latest
            command:
              - sh
              - -c
              - |
                mkdir -p /storage/app/public
                mkdir -p /storage/framework/{cache,sessions,views}
                mkdir -p /storage/logs
          init-public:
            image:
              repository: invoiceninja/invoiceninja
              tag: 5.12
            command:
              - sh
              - -c
              - |
                # Find and copy public files
                if [ -d /var/www/html/public ]; then
                  cp -a /var/www/html/public/. /public/
                elif [ -d /var/www/app/public ]; then
                  cp -a /var/www/app/public/. /public/
                else
                  echo "Public dir not found, listing /var/www:"
                  ls -la /var/www/ || true
                  ls -la /var/ || true
                  exit 1
                fi

        containers:
          app:
            image:
              repository: invoiceninja/invoiceninja
              tag: 5.12
            envFrom:
              - secretRef:
                  name: invoiceninja-secret

          nginx:
            image:
              repository: nginx
              tag: alpine
            command: ["/bin/sh", "-c"]
            args:
              - |
                cat > /etc/nginx/conf.d/default.conf << 'EOF'
                server {
                    listen 80 default_server;
                    server_name _;
                    root /var/www/html/public;
                    index index.php;
                    client_max_body_size 100M;

                    location / {
                        try_files $uri $uri/ /index.php?$query_string;
                    }

                    location = /favicon.ico { access_log off; log_not_found off; }
                    location = /robots.txt  { access_log off; log_not_found off; }

                    location ~ \.php$ {
                        fastcgi_split_path_info ^(.+\.php)(/.+)$;
                        fastcgi_pass 127.0.0.1:9000;
                        fastcgi_index index.php;
                        include fastcgi_params;
                        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                        fastcgi_param PATH_INFO $fastcgi_path_info;
                        fastcgi_buffer_size 16k;
                        fastcgi_buffers 4 16k;
                    }

                    location ~ /\.ht {
                        deny all;
                    }
                }
                EOF
                nginx -g 'daemon off;'

    service:
      app:
        controller: &app invoiceninja
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: "10.40.0.15"
        ports:
          http:
            port: &port 80

    route:
      app:
        hostnames: ["invoices.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      storage:
        existingClaim: invoiceninja-storage
        advancedMounts:
          invoiceninja:
            init-storage:
              - path: /storage
            app:
              - path: /var/www/html/storage
      public:
        type: emptyDir
        advancedMounts:
          invoiceninja:
            init-public:
              - path: /public
            app:
              - path: /var/www/html/public
            nginx:
              - path: /var/www/html/public
      # Mount uploaded files into public/storage
      public-storage:
        existingClaim: invoiceninja-storage
        advancedMounts:
          invoiceninja:
            app:
              - path: /var/www/html/public/storage
                subPath: app/public
            nginx:
              - path: /var/www/html/public/storage
                subPath: app/public

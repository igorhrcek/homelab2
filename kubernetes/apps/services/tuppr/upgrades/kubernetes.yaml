---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # Pinned to the running version until the Talos v1.14 roll completes:
    # Kubernetes 1.37 is only supported from Talos 1.14. Bump to v1.37.1 once
    # `kubectl get talosupgrade talos` reports Completed.
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'True')
      timeout: 10m
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      expr: |-
        status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN']
      timeout: 15m

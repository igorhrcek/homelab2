---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      piper:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: rhasspy/wyoming-piper
              tag: 2.5.2
            # Wyoming text-to-speech for Home Assistant Assist (Voice PE).
            # Entrypoint already sets --uri tcp://0.0.0.0:10200 --data-dir /data.
            args:
              - --voice
              - en_US-lessac-medium
              - --download-dir
              - /data
            env:
              TZ: "Europe/Belgrade"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  initialDelaySeconds: 15
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  periodSeconds: 10
                  failureThreshold: 30 # first start downloads the voice
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: piper
        ports:
          wyoming:
            port: 10200

    persistence:
      data:
        existingClaim: piper-data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

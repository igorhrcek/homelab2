---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: govee2mqtt
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      govee2mqtt:
        replicas: 1

        containers:
          app:
            image:
              repository: ghcr.io/wez/govee2mqtt
              tag: 2026.03.25-ab9deb66
              pullPolicy: IfNotPresent
            env:
              GOVEE_MQTT_HOST: "mosquitto.home.svc"
              GOVEE_LAN_BROADCAST_ALL: "true"
            envFrom:
              - secretRef:
                  name: govee2mqtt-secret
            securityContext:
              privileged: true

    persistence:
      data:
        existingClaim: govee2mqtt-config

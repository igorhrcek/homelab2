---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homeassistant
  namespace: flux-system
spec:
  targetNamespace: home
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/home/homeassistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: onepassword-connect-clustersecretstore
      namespace: flux-system
    - name: volsync
      namespace: flux-system
    - name: z2mqtt
      namespace: flux-system
    - name: govee2mqtt
      namespace: flux-system
    - name: external-dns
      namespace: network
    - name: unifi-dns
      namespace: network
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CLAIM: home-assistant-config
      VOLSYNC_CAPACITY: 10Gi
      APP_UID: "1000"
      APP_GID: "1000"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret

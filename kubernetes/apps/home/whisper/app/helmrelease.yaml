---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
  namespace: home
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      whisper:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: rhasspy/wyoming-whisper
              tag: 3.8.1
            # Wyoming speech-to-text for Home Assistant Assist (Voice PE).
            # Entrypoint already sets --uri tcp://0.0.0.0:10300 --data-dir /data --device cpu.
            args:
              - --model
              - small-int8
              - --language
              - en
              - --download-dir
              - /data
            env:
              TZ: "Europe/Belgrade"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  initialDelaySeconds: 15
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  periodSeconds: 10
                  failureThreshold: 60 # first start downloads the model
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 3Gi

    service:
      app:
        controller: whisper
        ports:
          wyoming:
            port: 10300

    persistence:
      data:
        existingClaim: whisper-data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

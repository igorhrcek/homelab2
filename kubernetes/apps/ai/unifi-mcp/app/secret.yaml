---
# 1Password item "unifi-mcp": a dedicated local UniFi admin (no SSO, no MFA).
# Fields: UNIFI_USERNAME, UNIFI_PASSWORD, optional UNIFI_API_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp-secret
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-mcp-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: unifi-mcp

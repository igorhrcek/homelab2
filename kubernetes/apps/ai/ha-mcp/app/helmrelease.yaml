---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ha-mcp
  namespace: ai
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        # The image creates and expects uid/gid 999 (mcpuser).
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

    controllers:
      ha-mcp:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1

        containers:
          # MCP HTTP has no caller authentication beyond the path. Exposure is
          # limited to the LAN / tailnet via a fixed LoadBalancer IP; never
          # route this through envoy-external or a tunnel without an auth layer.
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 9.0.0
            command: ["ha-mcp-web"]
            env:
              TZ: "Europe/Belgrade"
              HOME: /home/mcpuser
              HOMEASSISTANT_URL: http://homeassistant.home.svc.cluster.local:8123
              MCP_HOST: "0.0.0.0"
              MCP_PORT: "8086"
              # Default path; switch to a high-entropy MCP_SECRET_PATH (from the
              # secret) if this ever leaves the trusted LAN.
              MCP_SECRET_PATH: /mcp
              # Unauthenticated GET /healthz for the probes below.
              MCP_HEALTHZ: "true"
              BACKUP_HINT: normal
            envFrom:
              - secretRef:
                  name: ha-mcp-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8086
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness: *probe
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        globalMounts:
          - path: /home/mcpuser/.ha-mcp
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      app:
        controller: *app
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          external-dns.kubernetes.io/hostname: "ha-mcp.${SECRET_DOMAIN}."
          lbipam.cilium.io/ips: "10.40.0.19"
        ports:
          http:
            port: 8086

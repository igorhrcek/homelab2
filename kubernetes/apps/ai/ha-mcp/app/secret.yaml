---
# 1Password item "ha-mcp": a Home Assistant long-lived access token, ideally
# from a dedicated administrator user with "Local access only".
# Field: HOMEASSISTANT_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-mcp-secret
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ha-mcp-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ha-mcp

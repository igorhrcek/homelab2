---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atuin
  namespace: flux-system
spec:
  targetNamespace: security
  path: ./kubernetes/apps/security/atuin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 15m
  retryInterval: 1m
  timeout: 3m
  dependsOn:
    - name: volsync
      namespace: flux-system
    - name: external-dns
      namespace: network
    - name: unifi-dns
      namespace: network
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CLAIM: atuin-config
      VOLSYNC_CAPACITY: 10Gi
      APP_UID: "1000"
      APP_GID: "1000"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
